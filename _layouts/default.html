<!DOCTYPE html>
<html lang="es"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- FavIcon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/sumix-icon.svg">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos Globales -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css?v=2' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>

  <!-- Navegación Superior --> 
  <header class="site-header">
    <div class="nav-container">
      <a href="https://sumix.com.ve" class="logo-link">
        <img src="assets/images/sumix.jpg" alt="SUMIX Supply & Services" class="site-logo">
      </a>
      
      <button class="menu-toggle" aria-label="Abrir menú" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="nav-links" id="navLinks">
        <a href="https://sumix.com.ve" onclick="closeMenu()">Inicio</a>
        <a href="#nosotros" onclick="closeMenu()">Nosotros</a>
        <a href="#productos" onclick="closeMenu()">Productos</a>
         <!-- <a href="#servicios" onclick="closeMenu()">Servicios</a> -->
        <a href="#contacto" class="nav-btn-contact" onclick="closeMenu()">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="main-content">
    {{ content }}
  </main>

  <!-- Footer -->
<footer class="footer">
  <div class="container footer-container">
    
    <!-- Logo -->
    <div class="footer-brand">
      <a href="https://sumix.com.ve" class="logo-link">
      <img src="assets/images/logo-SUMIX2.png" alt="SUMIX Logo" class="footer-logo"> 
      </a>
    </div>

    <!-- Información en 3 columnas -->
    <div class="footer-info-grid">
      
      <!-- Columna 1: Sede Principal -->
      <div class="footer-col">
        <h3>Sede Principal</h3>
        <p class="icon-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          Calle Los Robles, No. 154, Los Cocoles,<br>El Tigre, Estado Anzoátegui,<br>Venezuela
        </p>
      </div>

      <!-- Columna 2: Contacto -->
      <div class="footer-col">
        <h3>Contacto</h3>
        <p class="icon-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          0414-8009142
        </p>
        <p class="icon-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          sumixca@gmail.com
        </p>
      </div>

      <!-- Columna 3: Sucursal Caracas -->
      <div class="footer-col">
        <h3>Sucursal Caracas</h3>
        <p class="icon-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          Muy pronto
        </p>
      </div>

    </div>
  </div>

  <!-- Copyright -->
  <div class="footer-bottom">
    <p>© 2021 SUMIX C.A. Todos los derechos reservados.</p>
  </div>
</footer>
  
  <script>
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('active');
    }
    function closeMenu() {
      document.getElementById('navLinks').classList.remove('active');
    }
  </script>
  <script src="assets/js/main.js"></script>

<!-- Botón Flotante de WhatsApp -->
<a href="https://wa.me/584148009142?text=Hola,%20quisiera%20más%20información" 
   class="whatsapp-float" 
   target="_blank" 
   rel="noopener noreferrer" 
   aria-label="Contactar por WhatsApp">
  <svg viewBox="0 0 32 32" class="whatsapp-icon">
    <path fill="currentColor" d="M16 0c-8.837 0-16 7.163-16 16 0 2.825 0.737 5.607 2.137 8.048l-2.137 7.952 8.135-2.135c2.372 1.3 5.060 1.987 7.865 1.987 8.837 0 16-7.163 16-16s-7.163-16-16-16zM16 29.35c-2.454 0-4.858-0.655-6.97-1.897l-0.5-0.296-5.18 1.358 1.382-5.143-0.325-0.518c-1.358-2.167-2.077-4.667-2.077-7.204 0-7.362 5.988-13.35 13.35-13.35s13.35 5.988 13.35 13.35-5.988 13.35-13.35 13.35zM22.502 19.398c-0.357-0.179-2.112-1.042-2.44-1.161s-0.566-0.179-0.804 0.179c-0.238 0.357-0.923 1.161-1.131 1.4-0.208 0.238-0.417 0.268-0.774 0.089s-1.507-0.555-2.871-1.771c-1.062-0.947-1.779-2.117-1.987-2.474s-0.022-0.551 0.156-0.728c0.161-0.16 0.357-0.417 0.536-0.625s0.238-0.357 0.357-0.595c0.119-0.238 0.060-0.446-0.030-0.625s-0.804-1.936-1.101-2.651c-0.289-0.697-0.583-0.602-0.804-0.613s-0.446-0.012-0.685-0.012c-0.238 0-0.625 0.089-0.952 0.446s-1.25 1.22-1.25 2.976 1.28 3.453 1.458 3.691c0.179 0.238 2.519 3.847 6.103 5.394 0.852 0.368 1.518 0.589 2.037 0.754 0.856 0.272 1.636 0.234 2.252 0.142 0.688-0.103 2.112-0.863 2.41-1.696s0.298-1.548 0.208-1.696c-0.089-0.149-0.357-0.238-0.714-0.417z"></path>
  </svg>
</a>
  
</body>
</html>
