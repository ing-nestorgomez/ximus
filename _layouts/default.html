<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- FavIcon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/sumix-icon.svg">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos Globales -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css?v=2' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>

  <!-- Navegación Superior -->
  <header class="site-header">
    <div class="nav-container">
      <a href="https://sumix.com.ve" class="logo-link">
        <img src="assets/images/sumix2.jpg" alt="SUMIX Supply & Services" class="site-logo">
      </a>
      
      <button class="menu-toggle" aria-label="Abrir menú" onclick="toggleMenu()">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="nav-links" id="navLinks">
        <a href="https://sumix.com.ve" onclick="closeMenu()">Inicio</a>
        <a href="#nosotros" onclick="closeMenu()">Nosotros</a>
        <a href="#productos" onclick="closeMenu()">Productos</a>
         <!-- <a href="#servicios" onclick="closeMenu()">Servicios</a> -->
        <a href="#contacto" class="nav-btn-contact" onclick="closeMenu()">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="main-content">
    {{ content }}
  </main>

  <!-- Footer -->
<footer class="footer">
  <div class="container footer-container">
    
    <!-- Logo -->
    <div class="footer-brand">
      <a href="https://sumix.com.ve" class="logo-link">
      <img src="assets/images/logo-SUMIX.png" alt="SUMIX Logo" class="footer-logo">
      </a>
    </div>

    <!-- Información en 3 columnas -->
    <div class="footer-info-grid">
      
      <!-- Columna 1: Sede Principal -->
      <div class="footer-col">
        <h3>Sede Principal</h3>
        <p class="icon-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          Calle Los Robles, No. 154, Los Cocoles,<br>El Tigre, Estado Anzoátegui,<br>Venezuela
        </p>
      </div>

      <!-- Columna 2: Contacto -->
      <div class="footer-col">
        <h3>Contacto</h3>
        <p class="icon-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          0414-8009142
        </p>
        <p class="icon-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          sumixca@gmail.com
        </p>
      </div>

      <!-- Columna 3: Sucursal Caracas -->
      <div class="footer-col">
        <h3>Sucursal Caracas</h3>
        <p class="icon-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          Muy pronto
        </p>
      </div>

    </div>
  </div>

  <!-- Copyright -->
  <div class="footer-bottom">
    <p>© 2021 SUMIX C.A. Todos los derechos reservados.</p>
  </div>
</footer>
  
  <script>
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('active');
    }
    function closeMenu() {
      document.getElementById('navLinks').classList.remove('active');
    }
  </script>
  <script src="assets/js/main.js"></script>
</body>
</html>
